name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  docs-present:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify core docs exist
        run: |
          test -f docs/PRD.md
          test -f docs/ARCHITECTURE.md
          test -f docs/ROADMAP.md
          test -f docs/CHANGELOG.md
          test -f CONTRIBUTING.md
          echo "core docs present"

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install pytest
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f packages/storage/requirements.txt ]; then pip install -r packages/storage/requirements.txt; fi
          if [ -f packages/api/requirements.txt ]; then pip install -r packages/api/requirements.txt; fi
      - name: Run tests
        run: pytest -v

  storage-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=avgadmin \
            -e MINIO_ROOT_PASSWORD=avgadmin-integration-secret \
            minio/minio server /data
      - name: Wait for MinIO to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live; then
              echo "minio ready"; exit 0
            fi
            sleep 1
          done
          echo "minio did not become ready"; docker logs minio; exit 1
      - name: Install dependencies
        run: pip install -r packages/storage/requirements.txt
      - name: Run storage integration tests
        env:
          RUN_STORAGE_INTEGRATION: "1"
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_ACCESS_KEY: avgadmin
          S3_SECRET_KEY: avgadmin-integration-secret
          S3_SECURE: "false"
        run: pytest -v -m integration packages/storage/tests/test_integration.py
  core-db-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: innercircle_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install pytest psycopg[binary]
          pip install -r packages/api/requirements.txt
      - name: Run core schema and state machine integration tests
        env:
          RUN_DB_INTEGRATION: "1"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/innercircle_test
        run: python -m pytest packages/db/tests -v -m db_integration
      - name: Run M1 acceptance tests (API, worker, restart recovery)
        env:
          RUN_DB_INTEGRATION: "1"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/innercircle_test
        run: python -m pytest packages/worker/tests -v -m db_integration
