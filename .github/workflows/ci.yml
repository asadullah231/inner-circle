name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  docs-present:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify core docs exist
        run: |
          test -f docs/PRD.md
          test -f docs/ARCHITECTURE.md
          test -f docs/ROADMAP.md
          test -f docs/CHANGELOG.md
          test -f CONTRIBUTING.md
          echo "core docs present"

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies (if present)
        run: |
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Run tests (if any exist)
        run: |
          if [ -d tests ] && [ -n "$(find tests -name 'test_*.py' 2>/dev/null)" ]; then
            python -m unittest discover -s tests -t . -v
          else
            echo "no tests yet — will land starting M1"
          fi
