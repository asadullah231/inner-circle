[pytest]
pythonpath = .
testpaths = tests packages
markers =
    integration: exercises a real MinIO; skipped unless RUN_STORAGE_INTEGRATION=1 (see packages/storage/tests/test_integration.py)
    db_integration: exercises a real Postgres; skipped unless RUN_STORAGE_DB_INTEGRATION=1 (see packages/storage/tests/test_db_integration.py)
